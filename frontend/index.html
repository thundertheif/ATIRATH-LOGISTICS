<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 📱 Viewport & Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- 🎨 Theme & Branding (RED THEME) -->
    <meta name="theme-color" content="#0a1a2f" />
    <meta name="msapplication-TileColor" content="#0a1a2f" />
    
    <!-- 🔍 SEO & Description -->
    <title>Atirath Logistics | Global Shipping & Freight Solutions</title>
    <meta name="title" content="Atirath Logistics | Global Shipping & Freight Solutions" />
    <meta name="description" content="Reliable, efficient logistics solutions across 120+ countries. Air, Ocean & Road freight with real-time tracking. Get instant quotes today!" />
    <meta name="keywords" content="logistics, freight, shipping, cargo, air freight, ocean freight, road transport, warehousing, India, global delivery" />
    <meta name="author" content="Atirath Logistics" />
    <meta name="robots" content="index, follow" />
    
    <!-- 🌐 Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atirathlogistics.com/" />
    <meta property="og:title" content="Atirath Logistics | Global Shipping & Freight Solutions" />
    <meta property="og:description" content="Reliable, efficient logistics solutions across 120+ countries. Air, Ocean & Road freight with real-time tracking." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- 🐦 Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://atirathlogistics.com/" />
    <meta property="twitter:title" content="Atirath Logistics | Global Shipping & Freight Solutions" />
    <meta property="twitter:description" content="Reliable, efficient logistics solutions across 120+ countries. Air, Ocean & Road freight with real-time tracking." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- 🔗 Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    
    <!-- 🔤 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- 🎨 Bootstrap 5 CSS (Required - Load First) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- 🎨 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    
    <!-- 🎨 Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- 🧭 Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- ⚡ Performance: DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.atirathlogistics.com" />
    
    <!-- 🎨 Custom CSS (Your Home.css will be imported in React) -->
    
    <style>
      /* Accessibility Skip Link */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #dc2626;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 9999;
        transition: top 0.2s ease;
      }
      .skip-link:focus {
        top: 0;
      }
           
      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    
    <!-- 🚀 Root Mount Point -->
    <div id="root"></div>

    <!-- 📦 Bootstrap 5 JS Bundle (Required for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 📦 Main Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
